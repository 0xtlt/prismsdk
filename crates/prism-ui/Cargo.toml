[package]
name = "prismsdk-ui"
description = "Prism's customizable component library: themed, accessible, overridable, with a native escape hatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-ui"
readme = "README.md"
keywords = ["ui", "components", "theme", "gui", "accessibility"]
categories = ["gui", "accessibility"]

[lib]
# The crate is `prismsdk-ui` on crates.io; code still writes `prism_ui`.
name = "prism_ui"

[dependencies]
prism-core.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
prism-testing = { package = "prismsdk-testing", path = "../prism-testing" }
rqrr = { version = "0.11", default-features = false }
qrcode = { version = "0.14", default-features = false }
