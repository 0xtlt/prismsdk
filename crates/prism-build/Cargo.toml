[package]
name = "prism-build"
description = "Build-time helpers for Prism apps: checked, typed translations from locales/*.json, and the app binary's link settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prism-build"
readme = "README.md"
keywords = ["i18n", "translations", "localization", "plurals", "build-script"]
categories = ["internationalization", "development-tools::build-utils"]

[dependencies]
serde_json.workspace = true
# link_app: the Apple link settings (Swift rpath, deployment targets).
prism-apple-build.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
