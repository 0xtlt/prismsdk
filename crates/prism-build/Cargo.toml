[package]
name = "prismsdk-build"
description = "Build-time helpers for Prism apps: checked, typed translations from locales/*.json, and the app binary's link settings (Apple SDK settings; on Windows the Windows App SDK runtime, manifest, icon and version information)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-build"
readme = "README.md"
keywords = ["i18n", "translations", "localization", "plurals", "build-script"]
categories = ["internationalization", "development-tools::build-utils"]

[lib]
# The crate is `prismsdk-build` on crates.io; code still writes `prism_build`.
name = "prism_build"

[dependencies]
serde_json.workspace = true
# link_app: the Apple link settings (Swift rpath, deployment targets).
prism-apple-build.workspace = true
# link_app on Windows: the app icon, from Prism.toml's PNG.
png = "0.18"
# The Windows App SDK packages, checked against their pinned SHA-256.
sha2 = "0.10"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
