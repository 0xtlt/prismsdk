[package]
name = "prismsdk-windows"
description = "Prism backend for Windows (WinUI 3, Windows App SDK)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-windows"
readme = "README.md"
keywords = ["windows", "winui", "xaml", "ui", "gui"]
categories = ["gui", "os::windows-apis"]

[lib]
# The crate is `prismsdk-windows` on crates.io; code still writes `prism_windows`.
name = "prism_windows"

[dependencies]
# Pure helpers (scene, key names, icons, palette) are tested on every host.
prism-core.workspace = true
prism-native.workspace = true

# WinUI 3 from the Windows App SDK (self-contained: its runtime goes next to
# the app, see build.rs), hosted in a Win32 window; WIC for pictures and
# snapshots. Builds with the GNU and the MSVC toolchains.
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows-numerics = "0.3"
# The generated WinUI projection refers to these crates by name.
windows-collections = "0.3"
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics",
  "Graphics_Imaging",
  "Storage_Streams",
  "System",
  "UI",
  "UI_Core",
  "UI_Text",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The WinUI projection is generated from the SDK's metadata at build time
# (pure Rust: runs on any host, cross-compiling included); prism-build
# fetches the SDK.
[build-dependencies]
prism-build.workspace = true
windows-bindgen = "=0.65.0"

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]
