[package]
name = "prismsdk-windows"
description = "Prism backend for Windows (WinUI 3, Windows App SDK)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-windows"
readme = "README.md"
keywords = ["windows", "winui", "xaml", "ui", "gui"]
categories = ["gui", "os::windows-apis"]

[lib]
# The crate is `prismsdk-windows` on crates.io; code still writes `prism_windows`.
name = "prism_windows"

[dependencies]
# Pure helpers (scene, key names, icons, palette) are tested on every host.
prism-core.workspace = true
# `gl3d`: the OpenGL renderer of 3D scenes (drawn with WGL).
prism-native = { workspace = true, features = ["gl3d"] }

# WinUI 3 from the Windows App SDK (self-contained: its runtime goes next to
# the app, see build.rs), hosted in a Win32 window; WIC for pictures and
# snapshots. Builds with the GNU and the MSVC toolchains.
[target.'cfg(target_os = "windows")'.dependencies]
# Web view messages are checked to be JSON.
serde_json.workspace = true
# Videos with request headers: HTTP range requests (`stream.rs`).
prism-http.workspace = true
# 3D scenes: the GL context of prism-native's renderer.
glow.workspace = true
windows-core = "0.62"
windows-numerics = "0.3"
# The generated WinUI projection refers to these crates by name.
windows-collections = "0.3"
windows-future = "0.3"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "ApplicationModel_Core",
  "ApplicationModel_DataTransfer",
  "ApplicationModel_DataTransfer_DragDrop",
  "Foundation",
  "Foundation_Collections",
  "Graphics",
  "Graphics_Imaging",
  "Media",
  "Media_Casting",
  "Media_Core",
  "Media_Playback",
  "Media_Streaming_Adaptive",
  "Security_Credentials_UI",
  "Storage",
  "Storage_Streams",
  "System",
  "UI",
  "UI_Core",
  "UI_Text",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Devices_BiometricFramework",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_OpenGL",
  "Win32_Security_Credentials",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# The WinUI projection is generated from the SDK's metadata at build time
# (pure Rust: runs on any host, cross-compiling included); prism-build
# fetches the SDK.
[build-dependencies]
prism-build.workspace = true
windows-bindgen = "=0.65.0"

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]
