[package]
name = "prismsdk-apple-build"
description = "Build-script helper: compiles Prism's Swift bridge (WidgetKit, ActivityKit, UserNotifications) and links it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-apple-build"
readme = "README.md"
keywords = ["swift", "xcode", "build-script", "widgetkit", "ios"]
categories = ["development-tools::build-utils", "development-tools::ffi"]

[lib]
# The crate is `prismsdk-apple-build` on crates.io; code still writes `prism_apple_build`.
name = "prism_apple_build"

[dependencies]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
