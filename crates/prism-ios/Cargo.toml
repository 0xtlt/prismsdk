[package]
name = "prismsdk-ios"
description = "Prism backend for iOS (UIKit native views)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-ios"
readme = "README.md"
keywords = ["ios", "uikit", "tvos", "visionos", "gui"]
categories = ["gui"]

[lib]
# The crate is `prismsdk-ios` on crates.io; code still writes `prism_ios`.
name = "prism_ios"

[features]
# The bridge's optional parts (#312, #314), read by its build script: each links a
# framework that costs ~1 s of dyld work at launch in the simulator.
# AuthenticationServices: Sign in with Apple, web sign-in, passkeys.
sign-in = []
# PhotosUI: the photo library picker.
photo-picker = []
# StoreKit: in-app purchases (#312).
purchases = []
# Protected resources: App Store Connect wants a purpose string for each one
# whose API the binary references. `prism` turns them on from Prism.toml's
# [permissions], which also writes the strings.
# CoreLocation (`location`; `location-always`: the Always authorization).
location = []
location-always = ["location"]
# The camera's permission and `take_photo`; the microphone's permission.
camera = []
microphone = []
# The photo library's permission (PHPhotoLibrary; the picker needs none).
photo-library = []
# LocalAuthentication on iOS and visionOS (Face ID): biometric secrets, owner
# checks. macOS and watchOS always have it.
face-id = []

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
prism-core.workspace = true
prism-native = { workspace = true, features = ["apple-bridge"] }
objc2.workspace = true
objc2-foundation.workspace = true
objc2-ui-kit.workspace = true
objc2-quartz-core.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
block2.workspace = true
dispatch2.workspace = true

[build-dependencies]
prism-apple-build.workspace = true

[package.metadata.docs.rs]
# docs.rs builds on Linux, without Xcode or the Android NDK, and C dependencies
# (ring, through prism-http) cannot be cross-compiled there. This crate's only
# public item is `run`, which the `prism` facade calls on iOS, tvOS and visionOS; on the default
# target the page shows the crate overview. `cargo doc --target aarch64-apple-ios`
# documents it locally.
targets = []
rustdoc-args = ["--cfg", "docsrs"]
