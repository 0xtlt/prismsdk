[package]
name = "prismsdk-web"
description = "Prism web backend: server-side rendering + DOM patches over a WebSocket. No WASM. Embeddable in Axum or any HTTP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-web"
readme = "README.md"
keywords = ["ui", "liveview", "ssr", "websocket", "axum"]
categories = ["web-programming", "web-programming::http-server", "web-programming::websocket", "gui"]

[lib]
# The crate is `prismsdk-web` on crates.io; code still writes `prism_web`.
name = "prism_web"

[features]
default = ["server"]
# Axum router + a standalone server (`run`). Without it, use `WebApp::handle`
# and `WebApp::connect` from any HTTP/WebSocket stack.
server = ["dep:axum", "dep:tokio", "dep:futures-util"]

[dependencies]
prism-core.workspace = true
# Pictures with headers (`Picture::header`): fetched by the server.
prism-http.workspace = true
serde_json.workspace = true
http = "1"
sha2 = "0.10"
# Secrets at rest (AES-256-GCM) and WebAuthn signatures (ES256, RS256).
ring = "0.17"
# Compressed socket messages and HTTP bodies (pure Rust backend, already in
# the tree through prism-http's HTTP client).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["ws", "tokio", "http1", "query"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink"] }

[[example]]
name = "embed"
required-features = ["server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
