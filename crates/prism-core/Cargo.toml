[package]
name = "prismsdk-core"
description = "Platform-agnostic core of Prism: elements, styles, entities and the reconciler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-core"
readme = "README.md"
keywords = ["ui", "gui", "declarative", "reconciler", "cross-platform"]
categories = ["gui"]

[lib]
# The crate is `prismsdk-core` on crates.io; code still writes `prism_core`.
name = "prism_core"

[features]
default = ["gltf"]
# glTF 2.0 model import (`scene3d::gltf`, `Model::from_glb`/`from_gltf`).
# Without it the importer returns `ModelError::Unsupported`.
gltf = ["dep:gltf-json"]

[dependencies]
# Island props and event details (JSON); serde_json is already in every
# app's tree (prism-http, prism-web).
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The glTF crate's JSON layer only (typed document; no image decoding, no
# filesystem): GLB chunks, buffers and accessors are read in `scene3d/gltf.rs`.
# Widget-action links (macOS widgets open the app on them) carry an
# HMAC-SHA256 of the action, so only the app's own widgets can run one.
hmac = "0.12"
sha2 = "0.10"
gltf-json = { version = "1.4", default-features = false, features = ["names", "extensions", "KHR_materials_emissive_strength", "KHR_materials_unlit"], optional = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
prism-testing = { package = "prismsdk-testing", path = "../prism-testing" }
