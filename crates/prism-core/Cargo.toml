[package]
name = "prism-core"
description = "Platform-agnostic core of Prism: elements, styles, entities and the reconciler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prism-core"
readme = "README.md"
keywords = ["ui", "gui", "declarative", "reconciler", "cross-platform"]
categories = ["gui"]

[dependencies]
# Island props and event details (JSON); serde_json is already in every
# app's tree (prism-http, prism-web).
serde = "1"
serde_json.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
prism-testing = { path = "../prism-testing" }
