[package]
name = "prismsdk-push"
description = "Send push notifications from your server: APNs (token-based, HTTP/2), FCM HTTP v1 and Web Push (RFC 8291 + VAPID). Also decrypts Web Push messages for UnifiedPush receivers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-push"
readme = "README.md"
keywords = ["push", "apns", "fcm", "webpush", "notifications"]
categories = ["web-programming", "network-programming"]

[lib]
# The crate is `prismsdk-push` on crates.io; code still writes `prism_push`.
name = "prism_push"

[features]
default = ["send"]
# The async `Sender` (reqwest over HTTP/2 + rustls) and FCM's RS256 OAuth
# assertion (ring). Without it: payloads, JWTs (ES256), Web Push encryption
# and decryption, in pure Rust (used by the Android and Linux receivers).
send = ["dep:reqwest", "dep:ring", "dep:rustls"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "pem", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hmac = "0.12"
sha2 = "0.10"
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["http2", "rustls-no-provider", "json", "form"] }

[dev-dependencies]
ring = "0.17"
tokio = { version = "1", features = ["rt"] }

[[example]]
name = "push"
required-features = ["send"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
