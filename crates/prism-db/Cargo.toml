[package]
name = "prismsdk-db"
description = "SQL for Prism apps (sqlx): SQLite on the device, the server's database on the web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-db"
readme = "README.md"
keywords = ["sqlx", "sqlite", "database", "ui", "offline"]
categories = ["database", "gui"]

[lib]
# The crate is `prismsdk-db` on crates.io; code still writes `prism_db`.
name = "prism_db"

[dependencies]
prism-core.workspace = true
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "derive"] }
# The SQLite that sqlx bundles: at least 3.54.0, which fixes CVE-2026-119375
# (RUSTSEC-2026-0459, stale memory read through a crafted WAL file). sqlx
# accepts older releases too, and Cargo keeps a version already in an app's
# lock file: this floor moves it. Checked at build time in `lib.rs`.
libsqlite3-sys = { version = ">=0.39.0, <0.41", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
