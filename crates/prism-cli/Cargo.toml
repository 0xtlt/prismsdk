[package]
name = "prismsdk-cli"
description = "The `prism` command: create, run, build and live-restart Prism apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://0xtlt.github.io/prismsdk/cli.html"
readme = "README.md"
keywords = ["cli", "ios", "android", "bundler", "ui"]
categories = ["command-line-utilities", "development-tools", "gui"]

[[bin]]
name = "prism"
path = "src/main.rs"
# Its docs would overwrite the `prism` library's (same name).
doc = false

[dependencies]
serde_json.workspace = true
# Google Play Developer API: HTTPS (rustls) and service-account JWTs (RS256);
# App Store Connect key checks (ES256).
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17"
base64 = "0.22"
# The Apple sources it writes out for bundling (widget extension, icons).
prism-apple-build.workspace = true
# `prism build windows`: the Windows App SDK runtime's files.
prism-build.workspace = true
# WASM islands: wasm-bindgen as a library (the version prism-island pins,
# so users install no CLI), and their gzip / brotli sizes.
wasm-bindgen-cli-support = "=0.2.130"
flate2 = "1"
brotli = "8"
# Private, randomly named temporary directories for signing checks.
tempfile = "3"

[dev-dependencies]
# S33: Android's sign-in callback check, against the core's.
prism-core.workspace = true
