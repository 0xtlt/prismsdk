[package]
name = "prismsdk"
description = "Write a UI once in Rust; ship it as a web server (HTML/CSS/JS) or a native app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk"
readme = "README.md"
keywords = ["ui", "gui", "cross-platform", "native", "web"]
categories = ["gui", "web-programming", "os::macos-apis", "os::android-apis", "accessibility"]

[lib]
# The crate is `prismsdk` on crates.io; code still writes `prism`.
name = "prism"

[features]
default = ["native"]
# Native widgets for the compilation target (AppKit on macOS, UIKit on iOS).
native = ["dep:prism-macos", "dep:prism-ios", "dep:prism-watchos", "dep:prism-linux", "dep:prism-android", "dep:prism-windows"]
# Server-driven web UI: plain HTML/CSS + a tiny JS client, no WASM.
web = ["dep:prism-web"]
# SQL (sqlx + SQLite): on the device natively, on the server for the web.
db = ["dep:prism-db"]
# Apple platforms (#314): Sign in with Apple, web sign-in (OAuth) and passkeys
# link AuthenticationServices, the photo picker links PhotosUI. Each one costs
# ~1 s of dyld work at every launch in the simulator, so apps ask for them.
# Elsewhere they change nothing.
sign-in = ["prism-macos?/sign-in", "prism-ios?/sign-in", "prism-watchos?/sign-in"]
photo-picker = ["prism-macos?/photo-picker", "prism-ios?/photo-picker", "prism-watchos?/photo-picker"]
# Apple platforms (#312): in-app purchases link StoreKit, which costs the
# same ~1 s at launch. Android and the web sell without it.
purchases = ["prism-macos?/purchases", "prism-ios?/purchases", "prism-watchos?/purchases"]
# Apple platforms: the protected resources App Store Connect wants a purpose
# string for whenever the binary references their API (ITMS-90683). `prism`
# turns each one on from Prism.toml's [permissions] (which writes those
# strings): `location`, `location_always`, `camera`, `microphone`, `photos`,
# `face_id`. Without it the call fails with a message saying what to
# declare. Elsewhere they change nothing.
location = ["prism-macos?/location", "prism-ios?/location", "prism-watchos?/location"]
location-always = ["location", "prism-macos?/location-always", "prism-ios?/location-always", "prism-watchos?/location-always"]
camera = ["prism-macos?/camera", "prism-ios?/camera", "prism-watchos?/camera"]
microphone = ["prism-macos?/microphone", "prism-ios?/microphone", "prism-watchos?/microphone"]
photo-library = ["prism-macos?/photo-library", "prism-ios?/photo-library", "prism-watchos?/photo-library"]
face-id = ["prism-macos?/face-id", "prism-ios?/face-id", "prism-watchos?/face-id"]

[dependencies]
prism-core.workspace = true
prism-ui.workspace = true
prism-http.workspace = true
# `PRISM_DESCRIBE=all` (bundlers): already in every build through prism-core.
serde_json.workspace = true
prism-web = { workspace = true, optional = true }
prism-db = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
prism-macos = { workspace = true, optional = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
prism-ios = { workspace = true, optional = true }

[target.'cfg(target_os = "watchos")'.dependencies]
prism-watchos = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
prism-linux = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
prism-android = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
prism-windows = { workspace = true, optional = true }

[package.metadata.docs.rs]
# The web backend and SQL too. The native backend on docs.rs' Linux builder
# is GTK 4 (installed there).
features = ["web", "db"]
rustdoc-args = ["--cfg", "docsrs"]
