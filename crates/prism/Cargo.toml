[package]
name = "prismsdk"
description = "Write a UI once in Rust; ship it as a web server (HTML/CSS/JS) or a native app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk"
readme = "README.md"
keywords = ["ui", "gui", "cross-platform", "native", "web"]
categories = ["gui", "web-programming", "os::macos-apis", "os::android-apis", "accessibility"]

[lib]
# The crate is `prismsdk` on crates.io; code still writes `prism`.
name = "prism"

[features]
default = ["native"]
# Native widgets for the compilation target (AppKit on macOS, UIKit on iOS).
native = ["dep:prism-macos", "dep:prism-ios", "dep:prism-watchos", "dep:prism-linux", "dep:prism-android", "dep:prism-windows"]
# Server-driven web UI: plain HTML/CSS + a tiny JS client, no WASM.
web = ["dep:prism-web"]
# SQL (sqlx + SQLite): on the device natively, on the server for the web.
db = ["dep:prism-db"]

[dependencies]
prism-core.workspace = true
prism-ui.workspace = true
prism-http.workspace = true
# `PRISM_DESCRIBE=all` (bundlers): already in every build through prism-core.
serde_json.workspace = true
prism-web = { workspace = true, optional = true }
prism-db = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
prism-macos = { workspace = true, optional = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
prism-ios = { workspace = true, optional = true }

[target.'cfg(target_os = "watchos")'.dependencies]
prism-watchos = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
prism-linux = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
prism-android = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
prism-windows = { workspace = true, optional = true }

[package.metadata.docs.rs]
# The web backend and SQL too. The native backend on docs.rs' Linux builder
# is GTK 4 (installed there).
features = ["web", "db"]
rustdoc-args = ["--cfg", "docsrs"]
