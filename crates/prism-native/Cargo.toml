[package]
name = "prism-native"
description = "Shared machinery for native Prism backends: patch handling and flexbox layout (taffy)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
prism-core.workspace = true
taffy.workspace = true
prism-http.workspace = true
serde_json.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
# Only the Core Animation pieces motion uses: the default features link Metal,
# which watchOS devices do not have.
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std", "CAAnimation", "CABase", "CALayer", "CAMediaTiming", "CAMediaTimingFunction",
  "CATransform3D", "objc2-core-foundation",
] }
objc2-core-foundation.workspace = true

[features]
# The Swift bridge (platform/apple/Bridge) is linked: device APIs available.
apple-bridge = []
