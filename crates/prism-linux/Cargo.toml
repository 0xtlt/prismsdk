[package]
name = "prism-linux"
description = "Prism backend for Linux desktops (GTK 4 native widgets)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prism-linux"
readme = "README.md"
keywords = ["linux", "gtk", "gtk4", "ui", "gui"]
categories = ["gui", "os::linux-apis"]

[target.'cfg(target_os = "linux")'.dependencies]
prism-core.workspace = true
prism-native.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
# Tray icons (StatusNotifierItem), on their own thread.
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
