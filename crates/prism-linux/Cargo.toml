[package]
name = "prismsdk-linux"
description = "Prism backend for Linux desktops (GTK 4 native widgets)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-linux"
readme = "README.md"
keywords = ["linux", "gtk", "gtk4", "ui", "gui"]
categories = ["gui", "os::linux-apis"]

[lib]
# The crate is `prismsdk-linux` on crates.io; code still writes `prism_linux`.
name = "prism_linux"

[target.'cfg(target_os = "linux")'.dependencies]
prism-core.workspace = true
prism-native = { workspace = true, features = ["gl3d"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
# UnifiedPush messages are Web Push messages: decrypted here (pure Rust).
prism-push = { workspace = true, default-features = false }
# 3D scenes: typed OpenGL / OpenGL ES 3 bindings (the gfx-rs team's, used by
# wgpu, egui and iced), without dependencies of their own on Linux. Function
# pointers come from libepoxy, which GTK already links (scene3d.rs), so no
# loader crate (epoxy, libloading) is needed.
glow.workspace = true
# Web views (`web-view`): WebKitGTK 6.0, the GTK 4 build of WebKit,
# through its C API (webkit.rs: the `webkit6` crate needs GTK 4.10).
webkit6-sys = { version = "0.6", optional = true }
javascriptcore6-sys = { version = "0.6", optional = true }
# The headers of app scheme requests and answers (#343): libsoup 3, which
# WebKitGTK 6.0 links.
soup3-sys = { version = "0.9", optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Web views (`web_view`) with WebKitGTK 6.0. Off by default: it links
# libwebkitgtk-6.0 (`libwebkitgtk-6.0-dev` to build, `libwebkitgtk-6.0-4`
# at run time), which apps without web views should not need. Without it a
# web view is an empty box and `capabilities().web_view` is false.
web-view = ["dep:webkit6-sys", "dep:javascriptcore6-sys", "dep:soup3-sys", "dep:serde_json"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
