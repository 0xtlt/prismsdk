[package]
name = "prismsdk-http"
description = "HTTP for Prism apps: `cx.fetch(Request::get(url)).await`, off the UI thread, same code on every platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-http"
readme = "README.md"
keywords = ["http", "client", "ui", "rustls", "async"]
categories = ["web-programming::http-client", "gui"]

[lib]
# The crate is `prismsdk-http` on crates.io; code still writes `prism_http`.
name = "prism_http"

[dependencies]
prism-core.workspace = true
# `public_only` plugs a resolver into ureq's unversioned API: pinned to
# the minor version it was written for.
ureq = { version = "~3.5.2", default-features = false, features = ["rustls", "gzip"] }
serde_json.workspace = true
# OAuth: PKCE (S256) and random state.
sha2 = "0.10"
getrandom = "0.3"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
