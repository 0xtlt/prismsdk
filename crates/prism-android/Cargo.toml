[package]
name = "prismsdk-android"
description = "Prism backend for Android: the app runs in Rust, a small Java host shows native Android views."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/prismsdk-android"
readme = "README.md"
keywords = ["android", "jni", "wear-os", "ui", "gui"]
categories = ["gui", "os::android-apis"]

[lib]
# The crate is `prismsdk-android` on crates.io; code still writes `prism_android`.
name = "prism_android"

[target.'cfg(target_os = "android")'.dependencies]
prism-core.workspace = true
prism-native.workspace = true
serde_json.workspace = true
jni-sys = "0.4.1"
# UnifiedPush messages are Web Push messages: decrypted here (pure Rust).
prism-push = { workspace = true, default-features = false }
base64 = "0.22"

[package.metadata.docs.rs]
# docs.rs builds on Linux, without Xcode or the Android NDK, and C dependencies
# (ring, through prism-http) cannot be cross-compiled there. This crate's only
# public item is `run`, which the `prism` facade calls on Android; on the default
# target the page shows the crate overview. `cargo doc --target aarch64-linux-android`
# documents it locally.
targets = []
rustdoc-args = ["--cfg", "docsrs"]
