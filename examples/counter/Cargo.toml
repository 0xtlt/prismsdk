[package]
name = "counter"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["native"]
native = ["prism/native"]
web = ["prism/web"]

[dependencies]
# The demo uses sign-in, passkeys and the photo picker (#314).
prism = { workspace = true, features = ["db", "sign-in", "photo-picker", "purchases"] }

[build-dependencies]
prism-build.workspace = true
