# Read by the `prism` command (prism run / build / dev).
[app]
name = "Counter"
package = "counter"
bundle_id = "dev.prism.counter"
version = "0.1.0"
icon = "icon.png"
# Store builds (prism build --store/--aab, prism publish): the build number
# (CFBundleVersion, Android versionCode) goes up with every upload.
build = 1
category = "public.app-category.productivity"
uses_encryption = false
description = "Todos, a counter and every Prism component."

[windows]
# The executable's CompanyName (Explorer › Properties › Details).
publisher = "Prism contributors"

[push]
# Remote push: aps-environment + background pushes (Apple), the UnifiedPush
# receiver (Android). Real devices need the Push Notifications capability on
# the App ID; simulators accept `xcrun simctl push` (see push/*.apns).
enabled = true
apns_environment = "development"
# Android FCM (opt-in): Firebase's google-services.json for this package.
# google_services = "google-services.json"
# Web Push: the public half of `cargo run -p prismsdk-push --example push -- vapid`
# (or PRISM_VAPID_PUBLIC_KEY).
# vapid_public_key = "B…"

[ios]
# iCloud key-value storage for cx.cloud_storage() (devices: the App ID needs iCloud).
icloud = true
# Apple team for real devices (default: the team of a matching profile).
# team = "ABCDE12345"
# Default destinations.
# simulator = "iPhone 17"
# device = "My iPhone"
# Sign in with Apple (the App ID needs the capability; simulators cannot sign in).
# sign_in_with_apple = true

[permissions]
# Shown by iOS/macOS when the app asks.
location = "Shows where you are in the Components gallery."
camera = "Takes a photo in the Components gallery."
photos = "Picks photos in the Components gallery."
motion = "Shows the gyroscope in the Components gallery."
# iOS asks before the first Face ID use (Settings › Security).
face_id = "Unlocks your secret note in Settings."

[web]
# WASM islands (client-side Web Components), built by `prism run/dev/build
# web` for wasm32-unknown-unknown: islands/chart is <prism-island-chart>.
islands = ["islands/chart"]
# Gzip, per island (JS glue + WASM): `prism build web` fails above it.
island_budget_kb = 40
