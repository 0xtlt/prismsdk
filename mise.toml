[tools]
rust = { version = "1.99", targets = "aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-watchos,aarch64-apple-watchos-sim,aarch64-apple-visionos,aarch64-apple-visionos-sim,aarch64-linux-android,wasm32-unknown-unknown", components = "clippy,rustfmt" }
# Android: Java for the SDK tools, the SDK command-line tools (sdkmanager,
# avdmanager), cargo-ndk to build Rust for Android.
java = "temurin-21"
android-sdk = "23.0"
"cargo:cargo-ndk" = "4.1.2"
# The documentation site (docs/, `mise run docs`).
mdbook = "0.5.4"

[env]
IPHONEOS_DEPLOYMENT_TARGET = "17.0"
TVOS_DEPLOYMENT_TARGET = "17.0"
WATCHOS_DEPLOYMENT_TARGET = "10.0"
# WidgetKit and ActivityKit need visionOS 26.
XROS_DEPLOYMENT_TARGET = "26.0"
MACOSX_DEPLOYMENT_TARGET = "13.0"
# Where Android Studio puts the SDK, so every tool (and T3's device panel)
# finds it.
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
ANDROID_SDK_ROOT = "{{env.HOME}}/Library/Android/sdk"

[tasks.check]
description = "Type-check every crate on every supported target"
run = [
  "cargo check --workspace",
  "cargo check -p counter --no-default-features --features web",
  "cargo check -p counter --target aarch64-apple-ios-sim",
  "cargo check -p counter --target aarch64-apple-tvos-sim",
  "cargo check -p counter --target aarch64-apple-watchos-sim",
  "cargo check -p counter --target aarch64-apple-visionos-sim",
  "cargo ndk -t arm64-v8a -P 29 check -p counter --lib",
]

[tasks.test]
description = "Run the unit tests"
run = "cargo test --workspace"

[tasks.build]
description = "Build every crate and the example"
run = "cargo build --workspace --locked"

[tasks.clean]
description = "Delete what the builds made (the target folder, docs/book) and the Docker images and volume Prism builds, printing what it frees"
run = """
# A CARGO_TARGET_DIR outside this checkout may be shared with other
# checkouts: it is left alone.
dir=$(cd "${CARGO_TARGET_DIR:-target}" 2>/dev/null && pwd -P) || dir=
case "$dir" in
  "") ;;
  "$(pwd -P)"/*) cargo clean ;;
  *) echo "$dir is outside this checkout: left alone" ;;
esac
du -sh docs/book 2>/dev/null && rm -rf docs/book
if command -v docker >/dev/null 2>&1; then
  for image in prism-linux-dev prism-linux-a11y:gtk4.8 prism-linux-a11y:newest prism-windows-cross; do
    docker image rm "$image" >/dev/null 2>&1 && echo "removed the Docker image $image"
  done
  docker volume rm prism-cargo-registry >/dev/null 2>&1 && echo "removed the Docker volume prism-cargo-registry"
fi
true
"""

[tasks.docs]
description = "Build the documentation site into docs/book (`mdbook serve docs` to preview it live)"
run = "mdbook build docs"

[tasks.cli]
description = "Install the `prism` command (prism new / run / dev / build / devices)"
run = "cargo install --path crates/prism-cli --locked"

[tasks.web]
description = "Serve the example as a web app (HTML/CSS/JS, no WASM) on http://localhost:3000, restarting on save"
alias = "dev"
dir = "examples/counter"
run = "cargo run -q -p prismsdk-cli -- dev web"

[tasks.macos]
description = "Run the example as a native macOS (AppKit) app, restarting on save"
dir = "examples/counter"
run = "cargo run -q -p prismsdk-cli -- dev macos"

[tasks.ios]
description = "Run the example in the iOS simulator, restarting on save (PRISM_SIM=<name|udid>)"
dir = "examples/counter"
run = "cargo run -q -p prismsdk-cli -- dev ios"

[tasks.android]
description = "Run the example on the running Android emulator or phone, reinstalling on save (start one: emulator -avd Pixel_9)"
dir = "examples/counter"
run = "cargo run -q -p prismsdk-cli -- dev android"

[tasks.macos-app]
description = "Bundle the example as a macOS .app (widgets, notifications, deep links, icon) and open it"
dir = "examples/counter"
run = "cargo run -q -p prismsdk-cli -- run macos --bundle"

[tasks.device]
description = "Run the example on a paired iPhone: mise run device -- \"My iPhone\""
dir = "examples/counter"
run = "cargo run -q -p prismsdk-cli -- run ios --device"
