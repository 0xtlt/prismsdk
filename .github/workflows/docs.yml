name: Docs

# The book (docs/, mdBook) and the API docs build without warnings or broken
# links, and every crate still packages for crates.io. Nothing is deployed:
# the site will be hosted elsewhere (prismsdk.dev).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  build:
    # macOS: the Apple backends' build scripts compile Swift (Xcode).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust mdbook
      - uses: Swatinem/rust-cache@v2
      - name: Book
        run: mdbook build docs
      - name: Book links
        run: python3 scripts/docs-links.py docs/book
      - name: API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # Every crate packages and builds from its .crate file (files outside a
  # crate's directory, path dependencies without a version...).
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run
        run: cargo publish --workspace --dry-run --locked
