name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TVOS_DEPLOYMENT_TARGET: "17.0"
  WATCHOS_DEPLOYMENT_TARGET: "10.0"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  # Everything runs on macOS: the Apple backends link Swift (Xcode required).
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --workspace
      - name: Clippy (macOS)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (iOS simulator)
        run: cargo clippy -p counter --target aarch64-apple-ios-sim -- -D warnings
      - name: Clippy (iOS device)
        run: cargo clippy -p counter --target aarch64-apple-ios -- -D warnings
      - name: Clippy (tvOS, watchOS simulators)
        run: |
          cargo clippy -p counter --target aarch64-apple-tvos-sim -- -D warnings
          cargo clippy -p counter --target aarch64-apple-watchos-sim -- -D warnings
      - name: Clippy (web)
        run: cargo clippy -p counter --no-default-features --features web --target-dir target/web -- -D warnings

  # Linux: GTK backend and the web server, in the same image developers use.
  linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Dev image (Rust + GTK 4 + Xvfb)
        run: docker build -f docker/linux-dev.Dockerfile -t prism-linux-dev docker
      - name: Tests, clippy, GTK snapshot
        run: |
          docker run --rm -v "$PWD":/src -w /src -e CARGO_TARGET_DIR=/tmp/target prism-linux-dev sh -c '
            cargo test -p prism-core -p prism-native -p prism-web &&
            cargo clippy -p prism-linux -p counter --all-targets -- -D warnings &&
            cargo build -p counter &&
            cd examples/counter &&
            PRISM_SNAPSHOT=/tmp/linux.png PRISM_CLICK="+1" timeout 60 xvfb-run -a /tmp/target/debug/counter &&
            test -s /tmp/linux.png'
      - name: Production web image
        run: docker build -f docker/web.Dockerfile --build-arg PACKAGE=counter -t counter-web .

  bundles:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install the prism CLI
        run: cargo install --path crates/prism-cli --locked
      - name: Web server (release)
        working-directory: examples/counter
        run: prism build web
      - name: macOS app (widgets, icon)
        working-directory: examples/counter
        run: prism build macos
      - name: iOS app for the simulator
        working-directory: examples/counter
        run: prism build ios
      - name: Smoke test the web server
        run: |
          target/web/release/counter &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/ | grep -q 'id="prism-root"'
          curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/prism.png | grep -q 200
