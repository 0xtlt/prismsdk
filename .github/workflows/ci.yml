name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TVOS_DEPLOYMENT_TARGET: "17.0"
  WATCHOS_DEPLOYMENT_TARGET: "10.0"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  # Secrets anywhere in the history: gitleaks over every commit. Findings
  # checked by hand as not secrets (test vectors) are in .gitleaksignore.
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  # Everything runs on macOS: the Apple backends link Swift (Xcode required).
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Signing tools (Windows code-signing tests)
        run: brew install openssl@3 osslsigncode
      - name: Tests
        run: cargo test --workspace
        env:
          # The signing tests fail instead of skipping without the tools.
          PRISM_REQUIRE_SIGNING_TOOLS: "1"
      - name: A project from `prism new` builds (native and web)
        run: cargo test -p prismsdk-cli -- --ignored generated_project
      - name: Clippy (macOS)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (iOS simulator)
        run: cargo clippy -p counter --target aarch64-apple-ios-sim -- -D warnings
      - name: Clippy (iOS device)
        run: cargo clippy -p counter --target aarch64-apple-ios -- -D warnings
      - name: Clippy (tvOS, watchOS simulators)
        run: |
          cargo clippy -p counter --target aarch64-apple-tvos-sim -- -D warnings
          cargo clippy -p counter --target aarch64-apple-watchos-sim -- -D warnings
      - name: Clippy (web)
        run: cargo clippy -p counter --no-default-features --features web --target-dir target/web -- -D warnings

  # Linux: GTK backend and the web server, in the same image developers use.
  linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Dev image (Rust + GTK 4 + Xvfb)
        run: docker build -f docker/linux-dev.Dockerfile -t prism-linux-dev docker
      # GTK smoke (scripts/linux-smoke.sh): every tab under Xvfb, non-blank
      # snapshots, no crash or GTK criticals, and "+1" must change the window.
      - name: Tests, clippy, GTK smoke on every tab
        run: |
          mkdir -p linux-smoke
          docker run --rm -v "$PWD":/src -w /src -e CARGO_TARGET_DIR=/tmp/target prism-linux-dev sh -c '
            cargo test -p prismsdk-core -p prismsdk-native -p prismsdk-web -p prismsdk-ui &&
            cargo clippy -p prismsdk-linux -p counter --all-targets -- -D warnings &&
            cargo clippy -p prismsdk-linux --features web-view --all-targets -- -D warnings &&
            cargo test -p prismsdk-linux --features web-view links &&
            scripts/linux-smoke.sh linux-smoke'
      - name: Check the snapshots
        run: scripts/linux-smoke.sh --check linux-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: linux-smoke
          if-no-files-found: ignore
      - name: Linux package (.deb), installed and run
        run: |
          docker run --rm -v "$PWD":/src -w /src/examples/counter -e CARGO_TARGET_DIR=/tmp/target prism-linux-dev sh -c '
            PRISM_BUNDLE_ID=dev.prism.counter PRISM_APP_NAME=Counter PRISM_ICON=$PWD/icon.png \
              bash /src/crates/prism-cli/platform/scripts/linux-package.sh counter &&
            apt-get install -y /tmp/target/linux/counter_*.deb &&
            dpkg -L counter | grep -q /usr/share/applications/dev.prism.counter.desktop &&
            cd /tmp && PRISM_SNAPSHOT=/tmp/deb.png PRISM_CLICK="+1" timeout 60 xvfb-run -a counter &&
            test -s /tmp/deb.png'
      - name: Production web image
        run: docker build -f docker/web.Dockerfile --build-arg PACKAGE=counter -t counter-web .

  # Windows (MSVC): the whole workspace must build, lint and pass its tests,
  # and `prism build windows` must package the counter with its WinUI
  # backend (the release executable with its icon, version information and
  # manifest from link.exe, the Windows App SDK runtime, the assets) as a
  # zip. The runner has no desktop session, so nothing renders here
  # (scripts/windows-smoke.sh does, on a Windows PC). The WinUI backend's
  # build script fetches the Windows App SDK packages from nuget.org (into
  # target/winappsdk, cached with the target). The repository's symbolic
  # links (LICENSE-*, docker) may be checked out as small text files on
  # Windows: nothing here reads them.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Install the prism CLI
        run: cargo install --path crates/prism-cli --locked
      - name: Windows zip of the counter (WinUI)
        working-directory: examples/counter
        run: prism build windows
      - name: Check the zip
        shell: pwsh
        run: |
          $zip = Get-Item target/windows/counter-*-windows-x64.zip
          "{0}: {1:N1} MB" -f $zip.Name, ($zip.Length / 1MB)
          Expand-Archive $zip.FullName $env:RUNNER_TEMP/counter-zip
          $app = "$env:RUNNER_TEMP/counter-zip/Counter"
          foreach ($f in 'counter.exe', 'resources.pri', 'Microsoft.UI.Xaml.dll', 'Microsoft.WindowsAppRuntime.dll', 'Microsoft.Web.WebView2.Core.dll', 'assets/prism.png') {
            if (-not (Test-Path "$app/$f")) { throw "missing $f" }
          }
          if (Get-ChildItem $app -Recurse -Include *.pdb, *.d, *.rlib) { throw "build files in the zip" }
          $v = (Get-Item "$app/counter.exe").VersionInfo
          $v | Format-List ProductName, FileDescription, ProductVersion, CompanyName
          if ($v.ProductName -ne 'Counter' -or $v.FileDescription -ne 'Counter') { throw "version information" }
          # The PE header's subsystem: 2 is a Windows (GUI) program.
          $b = [IO.File]::ReadAllBytes("$app/counter.exe")
          $sub = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 92)
          if ($sub -ne 2) { throw "subsystem $sub, expected 2 (no console)" }
          # The manifest registers the WinUI runtime (reg-free WinRT).
          if (-not (Select-String -Path "$app/counter.exe" -Pattern 'Microsoft.UI.Xaml.Controls.XamlControlsResources' -Quiet)) { throw "no runtime manifest" }

  bundles:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install the prism CLI
        run: cargo install --path crates/prism-cli --locked
      - name: Web server (release)
        working-directory: examples/counter
        run: prism build web
      - name: macOS app (widgets, icon)
        working-directory: examples/counter
        run: prism build macos
      - name: iOS app for the simulator
        working-directory: examples/counter
        run: prism build ios
      - name: Smoke test the web server
        run: |
          target/web/release/counter &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/ | grep -q 'id="prism-root"'
          curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/assets/prism.png | grep -q 200

  # Store packages and every `prism publish --dry-run`, with throwaway keys:
  # no secrets, nothing sent. Real publishing needs the secrets listed in the
  # README (Shipping to stores › Secrets for CI).
  release-android:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Install the prism CLI
        run: cargo install --path crates/prism-cli --locked
      - name: Throwaway upload key and service account
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -storepass ci-upload -keypass ci-upload \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Prism CI Upload"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/sa.pem"
          python3 -c 'import json, sys; print(json.dumps({"type": "service_account", "private_key_id": "ci",
            "private_key": open(sys.argv[1]).read(), "client_email": "ci@prism-ci.iam.gserviceaccount.com",
            "token_uri": "https://oauth2.googleapis.com/token"}))' "$RUNNER_TEMP/sa.pem" > "$RUNNER_TEMP/service-account.json"
      - name: App Bundle and Google Play dry run
        working-directory: examples/counter
        env:
          PRISM_ANDROID_KEY_ALIAS: upload
          PRISM_ANDROID_KEYSTORE_PASS: ci-upload
        run: |
          export PRISM_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks" PRISM_PLAY_SERVICE_ACCOUNT="$RUNNER_TEMP/service-account.json"
          prism publish android --dry-run --track beta --rollout 0.1 --notes "CI"
      - name: Split APKs from the bundle, 16 KB aligned
        run: |
          echo '{"supportedAbis": ["arm64-v8a"], "supportedLocales": ["en"], "screenDensity": 420, "sdkVersion": 35}' > "$RUNNER_TEMP/device.json"
          bash crates/prism-cli/platform/scripts/bundletool.sh build-apks --bundle=target/android/release/Counter.aab \
            --output="$RUNNER_TEMP/counter.apks" --device-spec="$RUNNER_TEMP/device.json"
          mkdir "$RUNNER_TEMP/apks" && unzip -q "$RUNNER_TEMP/counter.apks" -d "$RUNNER_TEMP/apks"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign" -c -P 16 4 "$RUNNER_TEMP"/apks/splits/base-arm64_v8a.apk

  release-apple:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install the prism CLI
        run: cargo install --path crates/prism-cli --locked
      - name: Throwaway signing identity, profiles and App Store Connect key
        run: |
          bash scripts/test-signing.sh "$RUNNER_TEMP/signing" dev.prism.counter > "$RUNNER_TEMP/signing.env"
          # On the runners codesign finds an identity only in the search list,
          # even with --keychain ("could not be found in the keychain").
          security list-keychains -d user -s "$RUNNER_TEMP/signing/prism-test.keychain-db" $(security list-keychains -d user | tr -d '"')
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$RUNNER_TEMP/AuthKey_CITEST1234.p8"
      # visionOS needs Xcode 26's SDK (XROS_DEPLOYMENT_TARGET 26): not on this image.
      - name: App Store dry runs (iOS, tvOS, watchOS, macOS) and notarization dry run
        working-directory: examples/counter
        env:
          PRISM_ASC_KEY_ID: CITEST1234
          PRISM_ASC_ISSUER_ID: 00000000-0000-4000-8000-000000000000
        run: |
          source "$RUNNER_TEMP/signing.env"
          export PRISM_ASC_KEY="$RUNNER_TEMP/AuthKey_CITEST1234.p8"
          prism publish ios --dry-run
          prism publish tvos --dry-run
          prism publish watchos --dry-run
          prism publish macos --dry-run
          prism publish macos --direct --dry-run
      - name: Remove the throwaway keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing/prism-test.keychain-db" || true

  # The web client (client.js) against a tiny DOM: patches, events, shapes,
  # and the server's own SSR/patch fixture (no npm dependencies).
  web-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check crates/prism-web/src/client.js
          node --check scripts/web-e2e.mjs
      - name: Client tests
        run: node --test 'crates/prism-web/tests/js/*.test.mjs'

  # The counter's web server in headless Chrome (DevTools protocol over
  # Node's WebSocket): every tab loads and connects, +1 updates the count
  # through the socket, no console errors.
  web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web server
        run: cargo build -p counter --no-default-features --features web --target-dir target/web
      - name: End-to-end in headless Chrome
        run: CHROME="$(command -v google-chrome || command -v chromium)" node scripts/web-e2e.mjs
        timeout-minutes: 5

  # AppKit: the counter on every tab with the dev hooks. Fails on a crash, a
  # blank window, a PRISM_CLICK that finds nothing, or a missing
  # accessibility label/role/tab (PRISM_A11Y_DUMP).
  macos-smoke:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Run each tab, snapshot and check
        run: PRISM_SMOKE_OUT="$RUNNER_TEMP/macos-smoke" scripts/macos-smoke.sh
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: ${{ runner.temp }}/macos-smoke
          if-no-files-found: ignore

  # UIKit in the iOS simulator: builds and installs the app (with its widget
  # extension), launches it on each tab and checks the snapshot and the
  # accessibility tree (tab bar items, selected tab, buttons).
  ios-smoke:
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - name: Pick an iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          ds = [d for r, l in json.load(sys.stdin)["devices"].items() if "SimRuntime.iOS-" in r for d in l]
          print(next(d["udid"] for d in ds if d["name"].startswith("iPhone")))')"
          echo "PRISM_SIM=$udid" >> "$GITHUB_ENV"
      - name: Build, install, run each tab and check
        run: PRISM_SMOKE_OUT="$RUNNER_TEMP/ios-smoke" scripts/ios-smoke.sh
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke
          if-no-files-found: ignore

  # Android on an x86_64 emulator (KVM): builds the APK without Gradle,
  # installs it, opens each tab by deep link and checks with adb only that the
  # activity is resumed, the process alive, logcat free of crashes and the
  # screen not blank (scripts/android-smoke.sh).
  android-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;37.0.0 ndk;30.0.16248370
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: GTK headers (the host build describes assets and widgets)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Emulator, install, run each tab, check
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PRISM_ANDROID_ABI: x86_64
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-smoke.sh "$RUNNER_TEMP/android-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: ${{ runner.temp }}/android-smoke
          if-no-files-found: ignore
