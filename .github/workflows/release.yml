name: Release

# A pushed version tag (v0.2.0) gets its GitHub release, its notes taken from
# that version's section of CHANGELOG.md (scripts/release-notes.py). Run by
# hand with a tag, it updates that release from main's CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release-notes.py "${TAG#v}" > notes.md
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Prism ${TAG#v}" --notes-file notes.md
          else
            gh release create "$TAG" --title "Prism ${TAG#v}" --notes-file notes.md --verify-tag
          fi
