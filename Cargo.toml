[workspace]
resolver = "3"
# Island crates (WASM, built by `prism` for the web) are members too: they
# share the lock file, so their wasm-bindgen matches the CLI's.
members = ["crates/*", "examples/*", "examples/counter/islands/*"]

# Shared by every crate (`<field>.workspace = true`). The version is bumped
# here and in the `[workspace.dependencies]` entries below (RELEASING.md).
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["Prism contributors"]
repository = "https://github.com/0xtlt/prismsdk"
homepage = "https://prismsdk.dev"

[workspace.dependencies]
prism = { package = "prismsdk", path = "crates/prism", version = "0.2.0", default-features = false }
prism-core = { package = "prismsdk-core", path = "crates/prism-core", version = "0.2.0" }
prism-native = { package = "prismsdk-native", path = "crates/prism-native", version = "0.2.0" }
prism-web = { package = "prismsdk-web", path = "crates/prism-web", version = "0.2.0" }
prism-macos = { package = "prismsdk-macos", path = "crates/prism-macos", version = "0.2.0" }
prism-ios = { package = "prismsdk-ios", path = "crates/prism-ios", version = "0.2.0" }
prism-watchos = { package = "prismsdk-watchos", path = "crates/prism-watchos", version = "0.2.0" }
prism-linux = { package = "prismsdk-linux", path = "crates/prism-linux", version = "0.2.0" }
prism-android = { package = "prismsdk-android", path = "crates/prism-android", version = "0.2.0" }
prism-windows = { package = "prismsdk-windows", path = "crates/prism-windows", version = "0.2.0" }
prism-ui = { package = "prismsdk-ui", path = "crates/prism-ui", version = "0.2.0" }
prism-http = { package = "prismsdk-http", path = "crates/prism-http", version = "0.2.0" }
prism-apple-build = { package = "prismsdk-apple-build", path = "crates/prism-apple-build", version = "0.2.0" }
prism-build = { package = "prismsdk-build", path = "crates/prism-build", version = "0.2.0" }
prism-db = { package = "prismsdk-db", path = "crates/prism-db", version = "0.2.0" }
prism-push = { package = "prismsdk-push", path = "crates/prism-push", version = "0.2.0", default-features = false }
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }
serde_json = "1"
# OpenGL bindings: the 3D scene renderer (prism-native `gl3d`).
glow = "0.17"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-ui-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

# Path dependencies carry a version: crates.io resolves it, the workspace
# the path.

# Smaller, faster release builds (apps ship these).
[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
