[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
prism = { path = "crates/prism", default-features = false }
prism-core = { path = "crates/prism-core" }
prism-native = { path = "crates/prism-native" }
prism-web = { path = "crates/prism-web" }
prism-macos = { path = "crates/prism-macos" }
prism-ios = { path = "crates/prism-ios" }
prism-ui = { path = "crates/prism-ui" }
prism-http = { path = "crates/prism-http" }
prism-apple-build = { path = "crates/prism-apple-build" }
prism-build = { path = "crates/prism-build" }
prism-db = { path = "crates/prism-db" }
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
tungstenite = "0.30"
serde_json = "1"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-ui-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
